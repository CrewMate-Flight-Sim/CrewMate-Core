[package]
name = "crewmate-core"
version = "1.0.0"
description = "Shared Tauri backend of the CrewMate aircraft apps"
authors = ["Márcio Araújo"]
license = "GPL-3.0-only"
repository = "https://github.com/CrewMate-Flight-Sim/CrewMate-Core"
edition = "2021"
rust-version = "1.80"

[lib]
name = "crewmate_core"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
msfs = { git = "https://github.com/flybywiresim/msfs-rs", rev = "2f697b9aac9fa3c00474f901a7f7ee4218cf534b" }
log = "0.4"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
tauri-plugin-shell = "2"
rodio = { version = "0.19", default-features = true }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-prevent-default = "3"
cpal = "0.15"
windows = { version = "0.61", features = [
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
